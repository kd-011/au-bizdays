# Publishes to npm and cuts the GitHub Release when package.json carries a version npm does not have yet.
#
# To release: put a "## [x.y.z]" section in CHANGELOG.md, raise the version in package.json, src/version.ts and
# server.json (the build test checks they agree), and merge the pull request. This workflow then compares
# package.json's version with what npm has (scripts/release.mjs plan). If it is new, it runs the checks, publishes
# with provenance, then creates the v<version> tag and a GitHub Release whose notes are that CHANGELOG section.
# Re-running a failed run finishes whatever is left, so a failed release step does not need a new version.
# It can also be started by hand from the Actions tab (workflow_dispatch), which is how the first publish happens.
#
# Until au-bizdays exists on npm there is nothing to publish with unless the NPM_TOKEN repository secret is set.
# In that state the plan step prints a notice and the run ends green, so a merge never leaves a red run on main.
#
# npm auth, in this order, with no edit needed to switch:
#   1. The repository secret NPM_TOKEN, when it exists: a granular token with publish rights on au-bizdays and
#      bypass 2FA on. The first publish has to use this, because trusted publishing can only be configured on a
#      package that already exists.
#   2. Otherwise npm trusted publishing over OIDC. One-time setup on npmjs.com: the package's Settings >
#      Trusted publisher > GitHub Actions, repository kd-011/au-bizdays, workflow filename publish.yml.
#      It needs npm 11.5.1 or later (installed below) and `id-token: write`.
# Provenance needs the repository to stay public.
name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node is not given a registry: it would write a placeholder token, which would stop OIDC from being used.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: What is left to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: node scripts/release.mjs plan
      - name: Install npm 11 for trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run check
      - if: steps.plan.outputs.publish == 'true'
        run: npm test
      # Before publishing, so a missing changelog section cannot leave a version on npm with no release.
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "NPM_TOKEN is not set: publishing with trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public
      - name: Tag and GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --target "${GITHUB_SHA}"
