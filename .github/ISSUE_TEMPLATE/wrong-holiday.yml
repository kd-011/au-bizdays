name: Wrong or missing holiday
description: A date in the bundled data does not match the official list, or a statewide holiday is missing.
labels: [data]
body:
  - type: input
    id: state
    attributes:
      label: State or territory
      description: ACT, NSW, NT, QLD, SA, TAS, VIC or WA.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date and holiday
      description: For example "2027-06-14, King's Birthday".
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official page that shows the right date
      description: A government URL, not a blog or a calculator.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What au-bizdays said
      description: The command and its output.
      render: text
    validations:
      required: true
