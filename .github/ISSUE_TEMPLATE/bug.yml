name: Bug
description: A command or MCP tool gives the wrong answer, errors, or does not start.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `au-bizdays --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and operating system
      description: Output of `node -v`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Command or tool call, and what came back
      description: The exact arguments and output, including the exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
